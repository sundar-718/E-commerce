spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        "format_sql": true
    show-sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cache:
    type: redis

app:
  jwt:
    secret: change-me-in-production-with-a-long-random-string
    expiration-ms: 3600000

logging:
  level:
    "org.springframework.security": INFO
    "com.ecommerce.admin": INFO
